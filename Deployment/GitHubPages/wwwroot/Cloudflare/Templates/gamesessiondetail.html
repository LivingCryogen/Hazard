<article class="session-detail">
    <header>
        <h1 class="session-title">
            <span data-field="status"></span> Game
            <span data-field="dateLabel"></span>
            <span data-field="date"></span>,
            with <span data-field="players"></span>
        </h1>
    </header>

    <section>
        <h2>
            Game Session Details
        </h2>

        <dl>
            <dt>Id</dt><dd data-field="sessionid"></dd>
        </dl>

    </section>
</article>
